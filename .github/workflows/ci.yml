name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # The switcher sits inside an HTML block, where markdown links render as
      # literal brackets, and the i18n generator rewrites it in markdown form —
      # so it has to be verified, not trusted.
      - name: Check README language switcher
        run: bun run docs:switcher:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test --coverage

      - name: Build
        run: bun run build

      # A bundle can break silently: a stray `sideEffects: false` once cost us the
      # whole re-export tree, and lint, typecheck and tests all stayed green
      # because they run against src. Only the artifact shows it.
      - name: Smoke-test the built artifact
        run: |
          bun --eval '
            const pkg = await Bun.file("package.json").json();
            const targets = Object.values(pkg.exports ?? {})
              .map((entry) => (typeof entry === "string" ? entry : entry.default))
              .filter(Boolean);
            if (targets.length === 0) throw new Error("package.json declares no exports");
            for (const target of targets) {
              const names = Object.keys(await import(target));
              if (names.length === 0) throw new Error(`${target} exports nothing`);
              console.log(`${target}: ${names.length} exports`);
            }
          '

  # Claude Code and tools like it append "Co-Authored-By: Claude … <noreply@anthropic.com>"
  # to every commit by default. .claude/settings.json turns that off for anyone working in
  # this checkout and .githooks/commit-msg strips it locally, but a personal
  # settings.local.json overrides the first and hooks live per-machine — so this is the gate.
  #
  # Its own job: it needs the whole history and none of the toolchain, and a lint failure
  # should not be able to hide an attribution problem or the other way round.
  no-ai-trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check reads commit messages, and the default shallow fetch brings down no
          # history to read.
          fetch-depth: 0

      - name: Check for AI co-author trailers
        run: |
          # `%(trailers:key=…)` reads the parsed trailer block instead of grepping the whole
          # message, so a commit that merely discusses Claude in its subject or body is not
          # a hit — only an actual co-author trailer is.
          offenders=$(
            git log --format='%H%x09%(trailers:key=Co-authored-by,valueonly,separator=; )' |
              grep -iE 'claude|anthropic\.com' |
              cut -f1
          )

          if [ -n "$offenders" ]; then
            echo "These commits carry an AI co-author trailer:" >&2
            for sha in $offenders; do
              git log -1 --format='  %h %s' "$sha" >&2
            done
            echo "" >&2
            echo 'Set "includeCoAuthoredBy": false in your Claude Code settings — this repo' >&2
            echo "already ships it in .claude/settings.json — and run \`bun install\` so that" >&2
            echo ".githooks/commit-msg is installed. Existing commits need their message" >&2
            echo "rewritten (git commit --amend, or a rebase for anything older)." >&2
            exit 1
          fi

          echo "No AI co-author trailers."
