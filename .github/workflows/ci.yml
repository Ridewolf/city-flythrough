name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test --coverage

      - name: Build
        run: bun run build

      # A bundle can break silently: a stray `sideEffects: false` once cost us the
      # whole re-export tree, and lint, typecheck and tests all stayed green
      # because they run against src. Only the artifact shows it.
      - name: Smoke-test the built artifact
        run: |
          bun --eval '
            const pkg = await Bun.file("package.json").json();
            const targets = Object.values(pkg.exports ?? {})
              .map((entry) => (typeof entry === "string" ? entry : entry.default))
              .filter(Boolean);
            if (targets.length === 0) throw new Error("package.json declares no exports");
            for (const target of targets) {
              const names = Object.keys(await import(target));
              if (names.length === 0) throw new Error(`${target} exports nothing`);
              console.log(`${target}: ${names.length} exports`);
            }
          '
