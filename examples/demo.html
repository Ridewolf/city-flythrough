<!-- Build first (bun run build), then open this file via any static server:
     cd city-flythrough && bun run build && bunx serve .
     → http://localhost:3000/examples/demo.html -->
<!doctype html>
<meta charset="utf-8" />
<title>city-flythrough demo</title>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0b10;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .hud {
    position: fixed;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 8px;
    font: 13px ui-sans-serif, system-ui;
  }
  button {
    padding: 6px 12px;
    border: 0;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.12);
    color: #e2e8f0;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
</style>
<canvas id="city" aria-hidden="true"></canvas>
<div class="hud">
  <button type="button" id="theme">Theme</button>
  <button type="button" id="toggle">Pause</button>
</div>
<script type="module">
  import { createCityFlythrough } from '../dist/index.js';

  const flythrough = createCityFlythrough(document.getElementById('city'));
  flythrough.start();

  let dark = true;
  let running = true;
  document.getElementById('theme').onclick = () => {
    dark = !dark;
    flythrough.setTheme(dark ? 'dark' : 'light');
    document.body.style.background = dark ? '#0a0b10' : '#e8edf3';
  };
  document.getElementById('toggle').onclick = (event) => {
    running = !running;
    if (running) flythrough.start();
    else flythrough.stop();
    event.target.textContent = running ? 'Pause' : 'Play';
  };
</script>
